{% extends "base.html" %}
{% block title %}Page Not Found — {{ biz.name }}{% endblock %}
{% block content %}
<section class="section" style="text-align:center;">
  <div class="container">
    <h1 style="font-size:4rem; color:var(--marigold);">404</h1>
    <h2>Looks like this road doesn't exist.</h2>
    <p style="margin:0 auto 1.6em;">The page you're looking for may have been moved or removed.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Back to Home</a>
  </div>
</section>
{% endblock %}
