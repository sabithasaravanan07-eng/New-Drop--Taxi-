{% extends "admin_base.html" %}
{% block title %}Settings{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block admin_content %}

<div class="panel">
  <div class="panel-head"><h3>Business Information</h3></div>
  <div class="panel-body">
    <form method="POST" action="{{ url_for('admin_settings') }}" data-validate>
      <input type="hidden" name="form_name" value="business_info">
      <div class="form-row">
        <div class="form-group">
          <label>Business Name</label>
          <input type="text" name="business_name" class="form-control" value="{{ settings.business_name }}" required>
        </div>
        <div class="form-group">
          <label>Owner Name</label>
          <input type="text" name="owner_name" class="form-control" value="{{ settings.owner_name }}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="tel" name="mobile_number" class="form-control" value="{{ settings.mobile_number }}" placeholder="9876543210" required>
          <small class="form-note">Displayed on the website and used for call links.</small>
        </div>
        <div class="form-group">
          <label>WhatsApp Number</label>
          <input type="text" name="whatsapp_number" class="form-control" value="{{ settings.whatsapp_number }}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Service Area</label>
          <input type="text" name="service_area" class="form-control" value="{{ settings.service_area }}" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" class="form-control" value="{{ settings.email }}">
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" name="address" class="form-control" value="{{ settings.address }}">
      </div>
      <div class="form-group">
        <label>Tagline</label>
        <input type="text" name="tagline" class="form-control" value="{{ settings.tagline }}">
      </div>
      <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button>
    </form>
  </div>
</div>

<div class="panel">
  <div class="panel-head"><h3>Admin Login Details</h3></div>
  <div class="panel-body">
    <form method="POST" action="{{ url_for('admin_settings') }}" data-validate style="max-width:420px;">
      <input type="hidden" name="form_name" value="change_credentials">
      <div class="form-group">
        <label>New Username</label>
        <input type="text" name="new_username" class="form-control" value="{{ settings.current_username }}" required minlength="3" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="current_password" class="form-control" required autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>New Password <span class="form-note">(leave blank to keep current)</span></label>
        <input type="password" name="new_password" class="form-control" minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-dark"><i class="fa-solid fa-user-lock"></i> Update Login Details</button>
    </form>
  </div>
</div>

{% endblock %}
